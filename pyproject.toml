[project]
name = "replang"
version = "0.1.0"
description = "Representações de Linguagem: de palavra a vetor, o que o vetor carrega e o viés que vem junto (BLIS 2S26)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dácio M. S." }]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "gensim>=4.3.3",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "streamlit>=1.35",
    "jupyterlab>=4.1",
    "notebook>=7.1",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
contextual = ["jax>=0.4.30", "jaxlib>=0.4.30"]
dev = ["pytest>=8.1", "pytest-cov>=5.0", "ruff>=0.4", "papermill>=2.5"]

[project.scripts]
replang = "replang.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replang"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
